<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数学首页 · 年级卡片风格预览</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; background: #EEF1F6; }
  .preview-wrap { max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; }
  .preview-tip { font-size: 12px; color: #97A1B3; text-align: center; margin: 4px 0 16px; }
</style>
</head>
<body>
<div class="preview-wrap">
  <div class="preview-tip">数学首页 · 年级卡片新风格预览（统一深色徽标 / 去边框 / 白色副标题 / 柔和 pastel 渐变）</div>
  <div class="grade-grid">
    <div class="grade-card" data-grade="1">
      <div class="grade-badge">1</div>
      <div class="grade-name">一年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
    <div class="grade-card" data-grade="2">
      <div class="grade-badge">2</div>
      <div class="grade-name">二年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
    <div class="grade-card" data-grade="3">
      <div class="grade-badge">3</div>
      <div class="grade-name">三年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
    <div class="grade-card" data-grade="4">
      <div class="grade-badge">4</div>
      <div class="grade-name">四年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
    <div class="grade-card" data-grade="5">
      <div class="grade-badge">5</div>
      <div class="grade-name">五年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
    <div class="grade-card" data-grade="6">
      <div class="grade-badge">6</div>
      <div class="grade-name">六年级</div>
      <div class="grade-sub">人教版 上下册</div>
    </div>
  </div>
</div>
</body>
</html>
