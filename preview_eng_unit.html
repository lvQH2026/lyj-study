<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>英语单元 · 序号图标预览</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/english.css">
<style>
  body { margin: 0; background: #EEF1F6; }
  .preview-wrap { max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; }
  .preview-tip { font-size: 12px; color: #97A1B3; text-align: center; margin: 4px 0 16px; }
  .section-title { font-size: 13px; font-weight: 700; color: #5B6678; margin: 18px 2px 8px; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="englishRoot" class="preview-wrap">
  <div class="preview-tip">英语板块 · 单元列表左侧序号圆形图标（v13 藏蓝墨蓝哑光 + 极淡弥散阴影 + 纯白纤细数字）</div>

  <div class="section-title">一级 · 字母与基础音</div>
  <div class="unit-list">
    <div class="unit-item">
      <div class="unit-number">P1</div>
      <div class="unit-info"><div class="unit-name">字母音 A–E 与自然拼读入门</div>
      <div class="unit-meta">5 步闭环 · 20 个单词</div></div>
      <div class="unit-arrow">›</div>
    </div>
    <div class="unit-item">
      <div class="unit-number">P2</div>
      <div class="unit-info"><div class="unit-name">字母音 F–J 与短元音</div>
      <div class="unit-meta">5 步闭环 · 20 个单词</div></div>
      <div class="unit-arrow">›</div>
    </div>
  </div>

  <div class="section-title">国际音标 IPA</div>
  <div class="unit-list">
    <div class="unit-item">
      <div class="unit-number">V1</div>
      <div class="unit-info"><div class="unit-name">单元音 /iː/ /ɪ/ 精讲</div>
      <div class="unit-meta">5 步闭环 · 标准 44 音素</div></div>
      <div class="unit-arrow">›</div>
    </div>
    <div class="unit-item">
      <div class="unit-number">V2</div>
      <div class="unit-info"><div class="unit-name">单元音 /e/ /æ/ 精讲</div>
      <div class="unit-meta">5 步闭环 · 标准 44 音素</div></div>
      <div class="unit-arrow">›</div>
    </div>
  </div>
</div>
</body>
</html>
