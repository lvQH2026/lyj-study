<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吕泳冀学习站 · 家长查看（电脑端）</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5f9; color:#1f2329; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#8a9099; font-size:13px; margin-bottom:22px; }
  .login { background:#fff; border:1px solid #e6e9ef; border-radius:12px; padding:22px; margin-bottom:24px; }
  .login .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .login label { display:block; font-size:13px; color:#5a6472; margin-bottom:6px; }
  .login input { padding:10px 12px; border:1px solid #d7dbe3; border-radius:8px; font-size:14px; width:240px; }
  .login button { padding:10px 22px; border:none; border-radius:8px; background:#3b6cf6; color:#fff; font-size:14px; cursor:pointer; }
  .login button:hover { background:#2f5be0; }
  .hint { font-size:12px; color:#8a9099; margin-top:10px; }
  .err { color:#cf1322; font-size:13px; margin-top:10px; }
  .cards { display:flex; gap:14px; margin-bottom:22px; }
  .card { flex:1; background:#fff; border:1px solid #e6e9ef; border-radius:12px; padding:18px; text-align:center; }
  .card .n { font-size:30px; font-weight:800; }
  .card .t { font-size:13px; color:#8a9099; margin-top:4px; }
  .c-blue .n { color:#3b6cf6; } .c-green .n { color:#1aab6b; } .c-red .n { color:#f04438; }
  .panel { background:#fff; border:1px solid #e6e9ef; border-radius:12px; padding:18px 20px; margin-bottom:18px; }
  .panel h2 { font-size:16px; margin:0 0 14px; }
  .bar-row { margin:8px 0; }
  .bar-row .lab { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .bar { height:9px; background:#eef0f4; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; border-radius:5px; }
  .chip { display:inline-block; background:#fff1f0; color:#cf1322; border:1px solid #ffccc7; padding:4px 10px; border-radius:12px; font-size:13px; margin:4px 6px 0 0; }
  .trend-row { font-size:13px; color:#5a6472; padding:3px 0; }
  .wrong-item { padding:12px 0; border-bottom:1px solid #f0f2f5; }
  .wrong-item:last-child { border-bottom:none; }
  .wrong-meta { font-size:12px; color:#8a9099; margin-bottom:4px; }
  .wrong-passage { font-size:13px; line-height:1.7; color:#5a6472; background:#f7f8fa; border:1px solid #eef0f4; border-radius:8px; padding:10px 12px; margin:6px 0 8px; max-height:140px; overflow-y:auto; }
  .wrong-stem { font-size:15px; font-weight:600; margin:2px 0 8px; }
  .wrong-svg { margin:6px 0; }
  .wrong-ans { font-size:14px; margin-top:4px; }
  .wrong-ans .me { color:#f04438; font-weight:700; }
  .wrong-ans .ok { color:#1aab6b; font-weight:700; }
  .wrong-explain { font-size:13px; color:#5a6472; margin-top:4px; }
  .loading { text-align:center; color:#8a9099; padding:30px; }
  .empty { color:#8a9099; font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>吕泳冀学习站 · 家长查看（电脑端）</h1>
  <div class="sub">用孩子手机上「家长」页显示的「学习ID + 口令」登录，即可在电脑上查看学习进度与逐题错题。</div>

  <div class="login">
    <div class="row">
      <div>
        <label>学习ID</label>
        <input id="pid" placeholder="例如 LYJXXXX" autocomplete="off" />
      </div>
      <div>
        <label>口令</label>
        <input id="ppw" placeholder="孩子手机上显示的口令" autocomplete="off" />
      </div>
      <div>
        <button onclick="doLogin()">查 看</button>
      </div>
    </div>
    <div class="hint">学习ID 与口令在孩子手机的「家长」页顶部「📱 本机学习凭证」中获取。</div>
    <div class="err hidden" id="perr"></div>
  </div>

  <div id="dash" class="hidden"></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function getChildStats(id, pw) {
  const cfg = window.APP_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) throw new Error('未配置云端（SUPABASE_URL/ANON_KEY 为空）');
  const url = cfg.SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/rpc/get_child_stats';
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':cfg.SUPABASE_ANON_KEY, 'Authorization':'Bearer '+cfg.SUPABASE_ANON_KEY },
    body: JSON.stringify({ p_learning_id: id, p_pw: pw })
  });
  if (!res.ok) throw new Error('网络错误 ' + res.status);
  return await res.json();
}

function renderStats(s) {
  const unitsHtml = (s.units||[]).slice(0,15).map(u => {
    const w = Math.max(0,Math.min(100,u.accuracy));
    const color = u.accuracy>=80?'#1aab6b':u.accuracy>=60?'#e8a000':'#f04438';
    return `<div class="bar-row"><div class="lab"><span>${esc(u.unit)}</span><span>${u.accuracy}% · ${u.count}次</span></div>
      <div class="bar"><div style="width:${w}%;background:${color}"></div></div></div>`;
  }).join('') || '<div class="empty">暂无数据</div>';

  const weakHtml = (s.weak&&s.weak.length)
    ? s.weak.map(u=>`<span class="chip">${esc(u.unit)}（${u.accuracy}%）</span>`).join('')
    : '<span class="empty">暂无明显薄弱点 🎉</span>';

  const trendHtml = (s.trend&&s.trend.length)
    ? s.trend.map(t=>`<div class="trend-row">${esc(t.date)}：练习 ${t.count} 题</div>`).join('')
    : '<div class="empty">暂无每日数据</div>';

  const wrongHtml = (s.wrong&&s.wrong.length)
    ? s.wrong.map(w => {
        const q = w.question||{};
        return `<div class="wrong-item">
          <div class="wrong-meta">${esc(w.unitName)}${w.grade?' · '+esc(String(w.grade))+'年级':''}</div>
          ${q.passage?`<div class="wrong-passage">${esc(q.passage)}</div>`:''}
          <div class="wrong-stem">${esc(q.question)}</div>
          ${q.svg?`<div class="wrong-svg">${q.svg}</div>`:''}
          <div class="wrong-ans">你的答案：<span class="me">${esc(w.userAnswer)}</span>　正确答案：<span class="ok">${esc(q.answer)}</span></div>
          ${q.explain?`<div class="wrong-explain">解析：${esc(q.explain)}</div>`:''}
        </div>`;
      }).join('')
    : '<div class="empty">暂无错题记录</div>';

  return `
    <div class="cards">
      <div class="card c-blue"><div class="n">${s.total||0}</div><div class="t">练习次数</div></div>
      <div class="card c-green"><div class="n">${s.avg||0}%</div><div class="t">平均正确率</div></div>
      <div class="card c-red"><div class="n">${s.weak?s.weak.length:0}</div><div class="t">薄弱单元</div></div>
    </div>
    <div class="panel"><h2>📅 每日练习量</h2>${trendHtml}</div>
    <div class="panel"><h2>📊 各单元正确率</h2>${unitsHtml}</div>
    <div class="panel"><h2>🎯 薄弱点</h2><div>${weakHtml}</div></div>
    <div class="panel"><h2>❌ 逐题错题详情（最近 ${s.wrong?s.wrong.length:0} 道）</h2>${wrongHtml}</div>
  `;
}

async function doLogin() {
  const id = document.getElementById('pid').value.trim();
  const pw = document.getElementById('ppw').value.trim();
  const err = document.getElementById('perr');
  err.classList.add('hidden');
  if (!id || !pw) { err.textContent='请填写学习ID和口令'; err.classList.remove('hidden'); return; }
  const dash = document.getElementById('dash');
  dash.classList.remove('hidden');
  dash.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const stats = await getChildStats(id, pw);
    if (!stats) { dash.innerHTML = '<div class="err">未找到该学习ID，或口令不正确。</div>'; return; }
    dash.innerHTML = renderStats(stats);
    window.scrollTo({ top: dash.offsetTop - 10, behavior:'smooth' });
  } catch (e) {
    dash.innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';
  }
}

// 回车即登录
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
